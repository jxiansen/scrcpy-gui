[workspace]
resolver = "3"
members = ["rune-app"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }

# Rune ships patched forks of these crates. Cargo does not inherit [patch] from a
# dependency, so an app building Rune must repeat them at its own workspace root.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
naga = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "ecbe830bd0e7662548a0d0f8dc4c525f17703ace" }
