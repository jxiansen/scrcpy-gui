name: Release CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: scrcpy-gui-linux-x86_64
          - os: windows-latest
            asset: scrcpy-gui-windows-x86_64.exe
          - os: macos-latest
            asset: scrcpy-gui-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libudev-dev libasound2-dev

      - name: Build release binary
        run: cargo build --release --locked -p scrcpy-gui

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: cp target/release/scrcpy-gui ${{ matrix.asset }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\scrcpy-gui.exe ${{ matrix.asset }}

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # One publisher, not three matrix jobs racing to create the same draft
  # release (which used to lose assets or produce duplicate drafts).
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all staged assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
