name: Release CI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: scrcpy-gui-linux-x86_64
          - os: windows-latest
            asset: scrcpy-gui-windows-x86_64.exe
          - os: macos-latest
            asset: scrcpy-gui-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libudev-dev libasound2-dev

      - name: Build release binary
        run: cargo build --release -p scrcpy-gui

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: cp target/release/scrcpy-gui ${{ matrix.asset }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\scrcpy-gui.exe ${{ matrix.asset }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.asset }}
