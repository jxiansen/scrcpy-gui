name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options: [ patch, minor, major ]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          OLD=$(sed -n 's/^version = "\(.*\)"/\1/p' rune-app/Cargo.toml | head -1)
          IFS=. read -r MAJOR MINOR PATCH <<< "$OLD"
          case "${{ github.event.inputs.bump_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          sed -i "0,/^version = \".*\"/s//version = \"$NEW\"/" rune-app/Cargo.toml
          echo "NEW_VERSION=$NEW" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to v${{ env.NEW_VERSION }}"
          branch: "chore/version-bump-v${{ env.NEW_VERSION }}"
          title: "chore: bump version to v${{ env.NEW_VERSION }}"
          body: "Bumping version to v${{ env.NEW_VERSION }} (`rune-app/Cargo.toml`)"
          labels: |
            version-bump
            automated-pr
