name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libudev-dev libasound2-dev

      # scripts/check.py is the single gate definition: fmt, clippy, --locked
      # tests/build, repo consistency checks, i18n catalogs and all seven
      # structural fixture scenes. PNG goldens depend on font rasterisation and
      # were captured on Windows, so only the Windows leg runs them.
      - name: Full gate (Linux, no PNG goldens)
        if: runner.os == 'Linux'
        run: python scripts/check.py --no-golden

      - name: Full gate + PNG goldens (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check.py
