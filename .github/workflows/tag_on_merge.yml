name: Tag on Version Bump Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    # Only run when a version-bump PR is merged (not just closed).
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'chore/version-bump-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' rune-app/Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # A tag is immutable release history: never force-push or overwrite one.
      - name: Create and push tag (never overwrite)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists; refusing to overwrite it."
            exit 1
          fi
          git tag "v${VERSION}" HEAD
          git push origin "v${VERSION}"
