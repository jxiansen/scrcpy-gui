[package]
name = "scrcpy-gui"
version = "4.3.3"
edition.workspace = true
license.workspace = true

[build-dependencies]
embed-resource = "3.0"

[dependencies]
rune = { workspace = true, features = ["native-file-dialog"] }
rune-kit.workspace = true
rune-theme-opencode.workspace = true
# Rune's rune-text enables parley's `complex-scripts` (CJK word segmentation
# data) on every native target except Windows, where it assumes icu.dll covers
# it. It does not: Chinese text otherwise logs a missing segmentation model on
# every launch. Depending on parley directly unifies the feature on Windows too.
parley = { version = "0.12", default-features = false, features = ["std", "complex-scripts"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
zip = "8.1.0"
flate2 = "1.0"
tar = "0.4"
chrono = "0.4.45"
sha2 = "0.11"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
